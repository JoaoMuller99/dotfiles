devices: ({
  name: "Wireless Mouse MX Master 3";

  // A lower threshold number makes the wheel switch to free-spin mode
  // quicker when scrolling fast.
  smartshift: { on: true; threshold: 200; };

  hiresscroll: { hires: true; invert: false; target: false; };

  thumbwheel: {
    divert: true;
    invert: false;

    left: {
      mode: "OnInterval";
      interval: 2;
      action: {
        type: "Keypress";
        keys: ["KEY_VOLUMEDOWN"];
      };
    };
    right: {
      mode: "OnInterval";
      interval: 2;
      action: {
        type: "Keypress";
        keys: ["KEY_VOLUMEUP"];
      };
    };
  };

  // Higher numbers make the mouse more sensitive (cursor moves faster),
  // 4000 max for MX Master 3.
  dpi: 1600;

  buttons: (

    // Forward button
    { cid: 0x56; action = { type: "Keypress"; keys: ["KEY_FORWARD"]; }; },

    // Back button
    { cid: 0x53; action = { type: "Keypress"; keys: ["KEY_BACK"]; }; },

    {
      cid: 0xc4;
      action = {
          type: "Gestures";
          gestures: (
            {
              direction: "Up";
              mode: "NoPress";
            },
            {
              direction: "Down";
              mode: "NoPress";
            },
            {
              direction: "Left";
              mode: "OnRelease";
              action = {
                type: "Keypress";
                keys: ["KEY_LEFTMETA", "KEY_LEFTSHIFT", "KEY_TAB"];
              };
            },
            {
              direction: "Right";
              mode: "OnRelease";
              action = {
                type: "Keypress";
	      	keys: ["KEY_LEFTMETA", "KEY_TAB"];
              }
            },
	    {
              direction: "None";
              mode: "NoPress";
            }
          );
      };
    },
  );
});
